services:
  web:
    image: node:20-bullseye
    working_dir: /app
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WDS_SOCKET_PORT=3000
      - CI=false
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
